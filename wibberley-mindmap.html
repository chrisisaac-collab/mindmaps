<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Alex Wibberley — The Diet Swap That Reversed Cancer Risk in 14 Days</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
header{background:#1a1d2e;border-bottom:1px solid #2d3748;padding:20px 24px}
header h1{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:4px}
header p{font-size:0.8rem;color:#94a3b8}
.tabs{display:flex;gap:0;border-bottom:1px solid #2d3748;background:#1a1d2e;padding:0 24px}
.tab{padding:12px 20px;font-size:0.85rem;font-weight:500;cursor:pointer;color:#94a3b8;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:#60a5fa;border-bottom-color:#60a5fa}
.tab:hover{color:#e2e8f0}
.panel{display:none;padding:24px;max-width:1100px;margin:0 auto}
.panel.active{display:block}
.mindmap{display:flex;flex-direction:column;gap:12px}
.branch{background:#1e2235;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #2d3748;transition:border-color .2s}
.branch:hover{border-color:#60a5fa}
.branch-header{display:flex;align-items:center;gap:12px;padding:16px 20px;font-weight:600;font-size:0.95rem}
.branch-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.branch-arrow{margin-left:auto;transition:transform .3s;color:#94a3b8}
.branch.open .branch-arrow{transform:rotate(90deg)}
.leaves{display:none;padding:0 20px 16px;gap:8px;flex-direction:column}
.branch.open .leaves{display:flex}
.leaf{background:#141829;border-radius:8px;cursor:pointer;border:1px solid #252a3d}
.leaf-header{padding:12px 16px;font-size:0.85rem;font-weight:500;color:#93c5fd;display:flex;align-items:center;gap:8px}
.leaf-body{display:none;padding:0 16px 12px;font-size:0.82rem;line-height:1.65;color:#cbd5e1}
.leaf.open .leaf-body{display:block}
.leaf-arrow{margin-left:auto;font-size:0.7rem;color:#64748b;transition:transform .2s}
.leaf.open .leaf-arrow{transform:rotate(90deg)}
.summary h2{font-size:1.1rem;font-weight:700;color:#60a5fa;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid #2d3748}
.summary h2:first-child{margin-top:0}
.summary p{font-size:0.875rem;line-height:1.75;color:#cbd5e1;margin-bottom:12px}
.takeaways{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#1e2235;border-radius:12px;padding:18px;border:1px solid #2d3748;display:flex;gap:14px}
.card-num{font-size:1.5rem;font-weight:700;color:#60a5fa;flex-shrink:0;line-height:1}
.card-text{font-size:0.83rem;line-height:1.65;color:#cbd5e1}
.card-text strong{color:#e2e8f0;display:block;margin-bottom:4px;font-size:0.85rem}
</style>
</head>
<body>
<header>
  <h1>The Diet Swap That Reversed Cancer Risk in 14 Days</h1>
  <p>Dr. Alex Wibberley &nbsp;·&nbsp; Health Optimisation &nbsp;·&nbsp; <a href="https://youtu.be/ghdn9pBxXcM" style="color:#60a5fa;text-decoration:none" target="_blank">youtu.be/ghdn9pBxXcM</a></p>
</header>
