<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Alex Wibberley – The Diet Swap That Reversed Cancer Risk in 14 Days</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
header{background:#1a1d27;padding:20px 24px;border-bottom:1px solid #2d3148}
header h1{font-size:1.1rem;font-weight:700;color:#a78bfa}
header p{font-size:.8rem;color:#94a3b8;margin-top:4px}
.tabs{display:flex;gap:0;background:#1a1d27;border-bottom:1px solid #2d3148}
.tab{padding:12px 20px;cursor:pointer;font-size:.85rem;font-weight:600;color:#64748b;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:#a78bfa;border-bottom-color:#a78bfa}
.panel{display:none;padding:24px}
.panel.active{display:block}
.mindmap{display:flex;flex-direction:column;gap:12px}
.branch{background:#1e2235;border-radius:12px;overflow:hidden;cursor:pointer;border-left:4px solid #6d28d9}
.branch-header{padding:14px 18px;font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.branch-header .arrow{transition:transform .3s;color:#94a3b8;font-size:.8rem}
.branch.open .arrow{transform:rotate(180deg)}
.leaves{display:none;padding:0 18px 14px}
.branch.open .leaves{display:block}
.leaf{margin-top:10px;cursor:pointer;background:#252a40;border-radius:8px;padding:10px 14px}
.leaf-title{font-size:.82rem;font-weight:600;color:#c4b5fd;display:flex;justify-content:space-between}
.leaf-body{display:none;font-size:.8rem;color:#94a3b8;line-height:1.6;margin-top:8px}
.leaf.open .leaf-body{display:block}
.leaf.open .leaf-title .arr{transform:rotate(180deg)}
.arr{transition:transform .3s;display:inline-block}
.b1{border-left-color:#7c3aed}.b2{border-left-color:#0ea5e9}.b3{border-left-color:#10b981}
.b4{border-left-color:#f59e0b}.b5{border-left-color:#ef4444}.b6{border-left-color:#ec4899}
.summary h2{font-size:1rem;font-weight:700;color:#a78bfa;margin:20px 0 8px}
.summary h2:first-child{margin-top:0}
.summary p{font-size:.85rem;color:#94a3b8;line-height:1.7;margin-bottom:12px}
.takeaways{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#1e2235;border-radius:10px;padding:16px;border-top:3px solid #7c3aed}
.card-num{font-size:.7rem;font-weight:700;color:#a78bfa;letter-spacing:.05em;margin-bottom:6px}
.card p{font-size:.82rem;color:#cbd5e1;line-height:1.6}
@media(max-width:600px){.tabs{overflow-x:auto}.tab{white-space:nowrap}.takeaways{grid-template-columns:1fr}}
</ayle>
</head>
<body>
<header>
  <h1>Dr. Alex Wibberley – The Diet Swap That Reversed Cancer Risk in 14 Days</h1>
  <p>Nutrition &amp; Longevity · June 2026 · <a href="https://youtu.be/ghdn9pBxXcM" style="color:#a78bfa" target="_blank">Watch on YouTube</a></p>
</header>
