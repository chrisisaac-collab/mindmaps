<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blueprint to Get Flexible Once, Forever — Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--ink:#23211d;--mute:#6b665c;--card:#fff;--line:#e6e1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6}
header{padding:28px 20px 8px;max-width:900px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-size:clamp(1.5rem,4vw,2.2rem);margin:0 0 6px}
.sub{color:var(--mute);font-size:.92rem}
.tabs{display:flex;gap:6px;max-width:900px;margin:18px auto 0;padding:0 20px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;cursor:pointer;font:500 .9rem 'Inter',sans-serif;color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none;max-width:900px;margin:18px auto 60px;padding:0 20px}
.panel.active{display:block}
.branch{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;margin-bottom:12px;overflow:hidden}
.bh{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bh span.t{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--c)}
.bh:after{content:'+';font-size:1.3rem;color:var(--mute)}
.branch.open .bh:after{content:'–'}
.leaves{display:none;padding:0 14px 12px}
.branch.open .leaves{display:block}
.leaf{border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:10px 12px;cursor:pointer;background:#fdfcf9}
.leaf b{font-weight:600;font-size:.95rem}
.leaf p{display:none;margin:8px 0 0;font-size:.9rem;color:#403c35}
.leaf.open p{display:block}
.leaf.open{border-color:var(--c)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.sec h3{font-family:'Fraunces',serif;margin:0 0 8px}
.sec p{margin:0 0 10px;font-size:.95rem}
.tk{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.tk h4{margin:0 0 4px;font-size:1rem}.tk p{margin:0;font-size:.9rem;color:#403c35}
</style>
</head>
<body>
<header>
<h1>The Blueprint to Get Flexible Once, Forever</h1>
<div class="sub">Matt Smith (matthewismith) · Mobility &amp; flexibility coach · 39 min</div>
</header>
<div class="tabs">
<button class="tab active" onclick="switchTab('map',this)">Mind Map</button>
<button class="tab" onclick="switchTab('sum',this)">Full Summary</button>
<button class="tab" onclick="switchTab('act',this)">Actionable Takeaways</button>
</div>
<div id="map" class="panel active"></div>
<div id="sum" class="panel"></div>
<div id="act" class="panel"></div>
<script>
const branches=[
{t:"1. The Flexibility Ladder",c:"#b5532f",l:[
["What the ladder is","It is every factor restricting your flexibility and the level at which each one limits you: different muscles, nerve tensions, technique issues, strength deficits and more. To reach a goal flexibility you must bring everything up to at least that level, and anything below it is the limiter."],
["Why most people stall","Most people stretch the commonly focused areas, like hamstrings or lats, or just where they feel it. That is probably not their personal limitation. Breakthrough progress comes from working on the lowest items on your own ladder."],
["Fix, then repeat","Assess to find the lowest item, fix it, then fix the next lowest, and repeat until you reach the level you want. Matt spent 6 years of normal stretching staying tight and nowhere near the splits before he worked out his own ladder."],
["Path one vs path two","Path one is stretching like an amateur: choosing by feel and never measuring. Path two is stretching like a pro: measure first, test what is tight, decide between range and strength, then choose 3–5 stretches. He compares it to sharpening the axe for 30 minutes so the tree falls in half the time."]]},
{t:"2. Assess and Set the Goal",c:"#2f6f8f",l:[
["Muscle length tests","His shoulder example uses bands to isolate pec major, subscapularis with teres major, and lats during overhead reach, by changing arm position and rounding the lower back. The test showed the person needed to focus on the lats."],
["Test strength too","Touching toes involves more than hamstrings: adductor magnus, gastrocnemius, strong hip and spine flexors, and tension on the sciatic nerve. So you also test whether you have the strength to lift the leg and test the nerve."],
["Goals are skills","Strength goals are movement patterns like squat or overhead press, and flexibility goals should be too. The skills are pike, pancake, side split, front split, bridge, shoulder flexion, shoulder extension and comfortable squat."],
["Why skills matter","Skills involve many joints working together, so they transfer better than vague hip or shoulder drills. His example is Cam McEvoy, where the bridge was the metric for shoulder, spine and hip mobility for swimming, and Andre Strong needed pancake and side splits."]]},
{t:"3. Stretch Stacking",c:"#4c7a3a",l:[
["Opposite order to strength","In strength training you start with the big compound lift and finish with accessories. In flexibility you start with smaller isolated stretches, for example hamstrings and hip flexors, which open range for the bigger movement like a front split."],
["1 + 1 = 3","Two stretches for different areas give two units of progress. Two stretches for the same area compound: the first opens the pec major, so the lat stretch that follows goes further. The effect stacks on top of the previous exercise."],
["3–5 aligned stretches","Choose three to five stretches all aimed at the same skill. Done this way you will likely see progress almost every session."],
["Dennis's side-split stack","Tests: Taylor's pose (could not), pancake hip tilt with round back (could not), and passive versus isometric versus active strength. The stack: a bent-leg adductor and rotator exercise, then pancake training, then technique drills, then the side split itself."]]},
{t:"4. The Assisted-to-Resisted Spectrum",c:"#7a4ca0",l:[
["The spectrum","Using side splits: heavily assisted is full body weight and gravity, assisted adds ankle weights, then neutral, then a standing tilt lifting the leg against gravity, then weighted resisted work. Flexibility and strength are two ends of one spectrum."],
["What each end does","Assisted training pushes the ceiling of total flexibility. Resisted training makes your range stronger and more usable. The middle develops a bit of both. You choose based on which one is your limit."],
["Stacking across the spectrum","A resisted exercise strengthens into the new range and contracts the antagonist, which relaxes the stretched muscles so you go deeper next time. Alternating the two gives another 1 + 1 = 3 effect."],
["Sundra vs Sunniva","Sunniva is more flexible but Sundra is stronger in his range, so they have different ladders. Sunniva should do more active work and get stronger, Sundra more passive work to increase total range."]]},
{t:"5. The 10 Training Methods",c:"#b08a1e",l:[
["Methods 1–4","PIR or contract-relax; isometric stretching; isometric holds for reps (about 3 seconds per rep with rests, so each rep goes deeper); and active lifts, including eccentric overload with a bent knee to build strength at the top of the range."],
["Methods 5–6","Dynamic stretching uses speed and momentum and helps flexibility transfer to kicks and acrobatics. Ballistic stretching he learned living with Shaolin monks; he now prefers rapid contract-relax, using your own muscles to pull in so you control the depth."],
["Methods 7–9","Joint capsule releases for stiff people when other methods fail. Nerve flosses, glides and tensioners, since a nerve entrapment can stop progress without you knowing; the sciatic nerve stretches only about 8–10%. Soft tissue work through the stretch rather than blind foam rolling."],
["Method 10: technique","Technique drills are underrated. Side splits by just opening the legs jams the hip bone on bone; tilt the hips forward or turn the feet up. Bridge cues lifting up then arching over, and front splits keep hips square."]]},
{t:"6. Brain vs Body, and Scheduling",c:"#a03c5c",l:[
["Two kinds of adaptation","Brain: stretch tolerance improves at the supraspinal CNS level, so you can go further before the signal maxes out. Body: tendon stiffness and sarcomeres added in series. Brain changes are most powerful and stay long term."],
["What fades","Body changes like sarcomerogenesis reverse after about 6 weeks without use. Warming up only changes viscoelastic properties, like warm honey pouring more easily, and lasts a few hours. That is why people stretch for hours and stay stuck."],
["Fatigue blocks the brain","Calcium builds up in stretched sarcomeres, activating calpains, causing muscle fibre damage and inflammation that the brain detects as fatigue. That fatigue takes up room in your stretch perception, so train when it is not present."],
["When to train","Best: two or more days after sport or strength work that could affect it. Next: same day, with strength or sport in the morning and flexibility in the evening. Third: after the other training, reducing volume of each. Common mistake: stretching the day after, or as active recovery."]]}
];
const summary=[
["The Flexibility Ladder and the Two Paths","Matt Smith opens with the flexibility ladder: all the things restricting your flexibility and the level at which each limits you, including muscles, nerve tension, technique and strength deficits. To reach a goal you must raise everything to at least that level, and anything below it is the limiter. Most people stretch the usual areas or where they feel it, which is probably not their personal limitation. He says he stretched normally for six years, stayed very tight and nowhere near the splits, and only changed once he worked out his own ladder. He contrasts stretching like an amateur, by feel and without measurement, with stretching like a pro, who measures, tests, decides between range and strength and then picks three to five stretches. The axe analogy makes the point: sharpening for 30 minutes means the tree falls in an hour instead of four."],
["Assessment and Flexibility Skills","The assessment finds the lowest rung. For overhead mobility he isolates pec major, subscapularis with teres major and the lats using bands and arm or spine position. For touching toes he notes that hamstrings are only part of it: adductor magnus, calves, hip and spine flexor strength and sciatic nerve tension all matter, so you test range, strength and nerve. He argues that flexibility goals should be skills, like strength goals are movement patterns. The skills he lists are pike, pancake, side split, front split, bridge, shoulder flexion, shoulder extension and the comfortable squat. Because these involve many joints, they transfer better to sport and daily life than vague hip or shoulder drills. His examples include Olympic swimmer Cam McEvoy using the bridge as a mobility metric, and Andre Strong working on pancake and side splits."],
["Stretch Stacking","The order of exercises in flexibility training is the opposite of strength training. You start with smaller isolated stretches, such as hamstrings and hip flexors, which open range for a bigger movement like the front split. Stretch stacking is the multiplying effect: two stretches for different areas give two units of progress, but two for the same area compound, because the first, for the pec major, lets the second, for the lats, go further. He calls this one plus one equals three. Choosing three to five stretches aligned towards one skill means you will likely see progress almost every session."],
["The Assisted-to-Resisted Spectrum and the Ten Methods","Using side splits, he shows a spectrum from heavily assisted, through assisted with ankle weights and neutral, to a standing tilt against gravity and weighted resisted work. Flexibility and strength are two ends of one spectrum: assisted work pushes the ceiling of total range, resisted work makes the range stronger and usable. Alternating the two stacks, since the resisted exercise strengthens into new range and relaxes the muscles stretched before. His ten methods are PIR, isometrics, isometric reps, active lifts, dynamic stretching, ballistic or rapid contract-relax, joint capsule releases, nerve flosses and glides, soft tissue work, and technique drills. Technique matters: opening the legs sideways jams the hip, so you tilt the hips forward or turn the feet up."],
["The Worked Example and Focusing on Skills","He applies everything to an acrobat, Dennis. Taylor's pose and a pancake hip-tilt test both fail, and strength is checked passively, isometrically and actively. The resulting four-exercise stack runs from a bent-leg adductor and rotator exercise, to pancake training, to technique drills, to the side split, each making the next better. He argues that targeted sessions of three to five stretches per skill beat full-body routines, like completing a circle one skill at a time. To the worry about losing flexibility elsewhere, he replies that he can still drop into the side splits without proper training for over three years, because the lasting adaptation is mostly in the brain and skills overlap."],
["Brain Adaptation and Scheduling","Flexibility comes from changes in the brain, improved stretch tolerance at the supraspinal level, and from changes in the body such as tendon stiffness and added sarcomeres. The brain changes last, while body changes reverse after about six weeks without use and warm-up effects last only hours. Stretching causes calcium to enter the sarcomere through stretch-mediated channels, activating calpains, causing fibre damage and inflammation, which the brain detects as fatigue, much like strength training. That fatigue limits how much stretch you can tolerate, so timing matters. The best time is two or more days after sport or strength work that could affect the area, next best is the same day with flexibility in the evening, and third is after training with reduced volume. Stretching the day after, or as active recovery, is the most common mistake. His summary: set one or two skills, assess, stack three to five exercises one to two times per week, and schedule for lasting adaptation."]
];
const takeaways=[
["Pick one or two skills","Choose from pike, pancake, side split, front split, bridge, shoulder flexion or extension, or the squat, based on what you want to do."],
["Assess before you stretch","Measure your starting level and test muscle length, strength and nerve tension for that skill to find the lowest rung on your ladder."],
["Fix the lowest rung first","Work on the limiter, then the next lowest, and repeat until you reach the level you need."],
["Choose 3–5 stretches for one skill","Keep every exercise aligned to the same skill rather than a full-body routine."],
["Start with isolated stretches","Put the smaller isolated stretches first so they open range for the bigger compound movement at the end."],
["Mix assisted and resisted work","Use assisted work to push total range and resisted work to make it strong, and alternate them in a stack."],
["Use isometric reps","Replace one long hold with reps of about 3 seconds so each rep can go deeper at higher quality."],
["Check your technique","For side splits, tilt the hips forward or turn the feet up instead of just opening the legs, and learn the cue for each skill."],
["Train 1–2 times a week","Schedule sessions two or more days after related sport or strength work; otherwise do strength or sport in the morning and flexibility in the evening."],
["Avoid the day-after mistake","Do not stretch the day after strength training or treat it as active recovery, because fatigue limits the brain adaptation you want."]
];
const m=document.getElementById('map');
branches.forEach(b=>{const d=document.createElement('div');d.className='branch';d.style.setProperty('--c',b.c);
d.innerHTML='<div class="bh" onclick="toggleBranch(this.parentNode)"><span class="t">'+b.t+'</span></div><div class="leaves">'+b.l.map(x=>'<div class="leaf" onclick="toggleLeaf(event,this)"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>').join('')+'</div>';m.appendChild(d)});
document.getElementById('sum').innerHTML=summary.map(s=>'<div class="sec"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>').join('');
document.getElementById('act').innerHTML=takeaways.map((t,i)=>'<div class="tk"><div class="n">'+(i+1)+'</div><div><h4>'+t[0]+'</h4><p>'+t[1]+'</p></div></div>').join('');
function switchTab(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}
function toggleBranch(el){el.classList.toggle('open')}
function toggleLeaf(e,el){e.stopPropagation();el.classList.toggle('open')}
</script>
</body>
</html>
